<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunt Your Time</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fontlibrary.org/face/minecraftia">
  <link href="css/style.css" rel="stylesheet">
</head>

<body class="d-flex flex-column justify-content-center align-items-center text-center">
  <video id="background" autoplay muted loop playsinline>
    <source src="hutbgvid.mp4" type="video/mp4">
  </video>
  <div id="vanta-bg"></div>
  <div id="particles-bg"></div>
  <audio id="backgroundAudio" src="assets/audio/hutbgvid.mp3" loop muted preload="auto"></audio>
  <button class="btn minecraft-btn text-white position-fixed top-0 end-0 m-3 px-3 py-2 sound-control"
    id="soundToggle">SOUND OFF</button>

  <main class="d-grid gap-4 py-5">
    <h1 class="display-5 fw-bold brand-title mb-0">HUNT YOUR TIME</h1>
    <div class="d-grid d-sm-flex gap-3 justify-content-center">
      <button class="btn minecraft-btn text-white px-4 py-2" onclick="taskModal.showModal()">SAVE MY TASK</button>
      <button class="btn minecraft-btn text-white px-4 py-2" onclick="workModal.showModal()">GET WORK
        DONE</button>
    </div>
  </main>

  <dialog id="taskModal" class="border border-secondary bg-dark text-white rounded p-4 shadow">
    <form id="taskForm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fs-5 text-info mb-0">Save my task</h2>
        <button type="button" class="btn minecraft-btn text-white px-2 py-0" onclick="taskModal.close()">×</button>
      </div>
      <div class="d-grid gap-3 text-start">
        <div><label class="form-label" for="taskName">Task name</label><input class="form-control" id="taskName"
            required></div>
        <div><label class="form-label" for="taskDescription">Description</label><textarea class="form-control"
            id="taskDescription" rows="3"></textarea></div>
        <div><label class="form-label" for="taskCategory">Category</label><select class="form-select" id="taskCategory"
            required>
            <option value="" selected disabled>Choose a category</option>
            <option>Study</option>
            <option>Work</option>
            <option>Health</option>
            <option>Personal</option>
          </select></div>
        <div><label class="form-label" for="taskReminder">Reminder</label><input class="form-control"
            type="datetime-local" id="taskReminder"></div>
      </div>
      <div class="text-end mt-3"><button class="btn minecraft-btn text-white" type="submit">Save</button></div>
    </form>
  </dialog>

  <dialog id="workModal" class="border border-secondary bg-dark text-white rounded p-4 shadow">
    <form id="workForm">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fs-5 text-warning mb-0">Get work done</h2>
        <button type="button" class="btn minecraft-btn text-white px-2 py-0" onclick="workModal.close()">×</button>
      </div>
      <div class="d-grid gap-3 text-start">
        <div><label class="form-label" for="workTitle">Work title</label><input class="form-control" id="workTitle"
            required></div>
        <div><label class="form-label" for="workDescription">Description</label><textarea class="form-control"
            id="workDescription" rows="3" required></textarea></div>
        <div><label class="form-label" for="rewardCoins">Reward coins</label><input class="form-control" type="number"
            id="rewardCoins" min="0" value="10" required></div>
        <div><label class="form-label" for="workFile">Upload file</label><input class="form-control" type="file"
            id="workFile"></div>
        <div class="alert alert-success d-none mb-0" id="workSuccess">Work submitted.
        </div>
      </div>
      <div class="text-end mt-3"><button class="btn minecraft-btn text-white" type="submit" id="workSubmit">Submit
          Work</button></div>
    </form>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
  <script src="js/script.js"></script>
</body>

</html>
