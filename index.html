<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hunt Your Time</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <video id="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="hutbgvid.mp4" type="video/mp4">
  </video>
  <div class="shade"></div>
  <section class="hero" aria-label="Hunt Your Time">
    <div class="hero-content">
      <p class="eyebrow">A FANTASY PRODUCTIVITY QUEST</p>
      <h1>⚔ HUNT YOUR TIME</h1>
      <button type="button" class="btn pixel sound-control" id="sound" aria-pressed="false">🔇 SOUND OFF</button>
    </div>
    <a class="scroll" href="#app" aria-label="Scroll to begin">↓ SCROLL TO BEGIN ↓</a>
  </section>
  <main id="app" class="container-fluid py-3">
    <header class="bar d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <h2>YOUR ADVENTURE BOARD</h2>
      <span class="drink">🥫 <b id="drinks">340</b> SOULE DRINKS</span>
    </header>
    <section class="panel d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <div>MISSIONS <span id="count">0</span> · COMPLETED <span id="done">0</span></div>
      <div class="d-flex gap-2">
        <button type="button" class="btn pixel gold" data-bs-toggle="modal" data-bs-target="#taskModal" id="newTask">+ CREATE MISSION</button>
        <button type="button" class="btn pixel cyan" data-bs-toggle="modal" data-bs-target="#freeModal">I'M FREE</button>
      </div>
    </section>
    <nav id="filters" class="d-flex flex-wrap gap-2 mb-3" aria-label="Mission categories">
      <button type="button" class="btn pixel active" data-category="ALL">ALL</button>
      <button type="button" class="btn pixel" data-category="Study">STUDY</button>
      <button type="button" class="btn pixel" data-category="Play">PLAY</button>
      <button type="button" class="btn pixel" data-category="Meetings">MEETINGS</button>
      <button type="button" class="btn pixel" data-category="Fitness">FITNESS</button>
      <button type="button" class="btn pixel" data-category="Social">SOCIAL</button>
      <button type="button" class="btn pixel" data-category="Personal">PERSONAL</button>
      <button type="button" class="btn pixel" data-category="Miscellaneous">MISC</button>
    </nav>
    <section id="missions" class="row g-3" aria-live="polite">    </section>
  </main>
  <div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskHeading" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content panel">
      <div class="modal-header"><h2 class="modal-title" id="taskHeading">CREATE MISSION</h2><button class="btn pixel" data-bs-dismiss="modal">✕</button></div>
      <form id="taskForm" class="modal-body">
        <input id="taskId" type="hidden">
        <label class="form-label" for="title">MISSION</label><input class="form-control mb-2" id="title" required>
        <div class="row g-2 mb-2">
          <div class="col-7">
            <label class="form-label" for="category">CATEGORY</label>
            <select class="form-select" id="category"><option>Study</option><option>Play</option><option>Meetings</option><option>Fitness</option><option>Social</option><option>Personal</option><option>Miscellaneous</option></select>
          </div>
          <div class="col-5"><label class="form-label" for="duration">MINUTES</label><input class="form-control" id="duration" type="number" min="1" value="25" required></div>
        </div>
        <div class="row g-2">
          <div class="col-6"><label class="form-label" for="date">DATE</label><input class="form-control" id="date" type="date" required></div>
          <div class="col-6"><label class="form-label" for="time">START TIME</label><input class="form-control" id="time" type="time" required></div>
        </div>
        <button class="btn pixel gold w-100 mt-3">SAVE MISSION</button>
      </form>
    </div></div>
  </div>
  <div class="modal fade" id="freeModal" tabindex="-1" aria-labelledby="freeHeading" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content panel">
      <div class="modal-header"><h2 class="modal-title" id="freeHeading">HOW MUCH FREE TIME?</h2><button class="btn pixel" data-bs-dismiss="modal">✕</button></div>
      <div class="modal-body">
        <div class="d-flex gap-2 mb-3">
          <button type="button" class="btn pixel free" data-minutes="15">15 MIN</button>
          <button type="button" class="btn pixel free" data-minutes="30">30 MIN</button>
          <button type="button" class="btn pixel free" data-minutes="60">1 HOUR</button>
        </div>
        <label class="form-label" for="freeStart">CUSTOM WINDOW</label>
        <div class="d-flex gap-2">
          <input class="form-control" id="freeStart" type="time" value="14:00">
          <input class="form-control" id="freeEnd" type="time" value="15:00">
          <button type="button" class="btn pixel gold" id="match">FIND</button>
        </div>
        <div id="suggestion" class="mt-3"></div>
      </div>
    </div></div>
  </div>
  <div class="modal fade" id="timerModal" tabindex="-1" aria-labelledby="timerHeading" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content panel text-center">
      <div class="modal-header"><h2 class="modal-title" id="timerHeading">MISSION TIMER</h2><button class="btn pixel" data-bs-dismiss="modal">✕</button></div>
      <div class="modal-body"><div id="timerTitle"></div><div class="clock" id="clock">25:00</div>
        <button class="btn pixel cyan" id="pause">PAUSE</button> <button class="btn pixel" id="reset">RESET</button> <button class="btn pixel gold" id="timerDone">COMPLETE</button>
      </div>
    </div></div>
  </div>
  <div id="reward" class="reward" hidden role="status" aria-live="polite">
    <video src="soule.webm" muted playsinline aria-hidden="true"></video>
    <div class="reward-copy"><strong>MISSION COMPLETE!</strong><span id="rewardText">SOUL DRINK EARNED!</span></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
